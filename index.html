<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Revibe Books — Clinic Bookkeeping</title>
<style>
  :root{
    /* Revibe brand palette (matches the payroll dashboard) */
    --pine:#01594D; --teal:#04A987; --teal-2:#03937A; --teal-bg:#E4F4EF; --teal-ink:#044C40;
    --lime:#C9E7C1; --yellow:#F3DC72;
    --ink:#363636; --ink-2:#5C5C5C; --ink-3:#969696;
    --line:#E3E6EA; --line-2:#D2D7DD;
    --bg:#F3F6F5; --surface:#FFFFFF; --surface-2:#F1F5F3;
    --green:#07876B; --green-bg:#E4F4EF;
    --amber:#946112; --amber-bg:#F8EDD4;
    --coral:#A23D21; --coral-bg:#F7E5DE;
    --purple:#473D93; --purple-bg:#EAE8FA;
    --red:#A12C2C; --red-bg:#FAE8E8;
    --shadow:0 1px 2px rgba(1,89,77,.05), 0 6px 22px rgba(1,89,77,.07);
    --shadow-sm:0 1px 2px rgba(1,89,77,.06);
    --mono:ui-monospace,'SF Mono','SFMono-Regular',Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --round:ui-rounded,'SF Pro Rounded',var(--sans);
    --display:'Bebas Neue',Oswald,var(--round);
    --r:14px; --r-sm:9px; --r-xs:7px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
  .num,.tnum{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:1150px;margin:0 auto;padding:28px 24px 90px;animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.wrap{animation:none}*{transition:none!important}}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:8px;position:relative}
  .topbar::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--pine),var(--teal) 60%,transparent)}
  .brand{display:flex;align-items:center;gap:13px}
  .brand-mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(145deg,var(--pine),var(--teal));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(1,89,77,.3);color:#fff;font-family:var(--display);font-size:19px;letter-spacing:.02em}
  .brand h1{font-family:var(--display);font-size:25px;font-weight:700;margin:0;letter-spacing:.04em;line-height:1;text-transform:uppercase}
  .brand .sub{font-size:12px;color:var(--ink-3);margin-top:1px}
  .eyebrow{font-family:var(--display);font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--teal-2)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow-sm)}
  .muted{color:var(--ink-2)} .dim{color:var(--ink-3)}
  /* nav tabs */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px}
  .tab{font-family:var(--display);font-size:14px;letter-spacing:.05em;text-transform:uppercase;padding:8px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);transition:.13s}
  .tab:hover{border-color:var(--teal);color:var(--teal-ink)}
  .tab.on{background:linear-gradient(145deg,var(--pine),var(--teal));color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(1,89,77,.28)}
  /* metric cards */
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:18px 0}
  .metric{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--teal);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow-sm);transition:.15s}
  .metric:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
  .metric .lab{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
  .metric .val{font-size:26px;font-weight:720;letter-spacing:-.7px;margin-top:7px;font-family:var(--round)}
  .metric .hint{font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.45}
  .metric.m-green{border-top-color:var(--green)} .metric.m-amber{border-top-color:var(--amber)}
  .metric.m-coral{border-top-color:var(--coral)} .metric.m-purple{border-top-color:var(--purple)}
  .v-green{color:var(--green)} .v-amber{color:var(--amber)} .v-teal{color:var(--teal-2)} .v-coral{color:var(--coral)} .v-red{color:var(--red)}
  /* sections */
  .sec{margin-top:24px}
  .sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .sec-h h3{font-family:var(--display);font-size:19px;font-weight:700;margin:0;letter-spacing:.04em;text-transform:uppercase}
  .row{display:flex;align-items:center;gap:13px;padding:11px 15px;border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:8px;background:var(--surface);transition:.13s}
  .row:hover{border-color:var(--line-2);box-shadow:var(--shadow-sm)}
  .row .rmain{flex:1;min-width:0}
  .row .rt{font-size:13.5px;font-weight:560}
  .row .rs{font-size:12px;color:var(--ink-3);margin-top:2px;line-height:1.5}
  .row .ramt{font-size:14.5px;font-weight:680;font-family:var(--round);white-space:nowrap}
  .pill{flex-shrink:0;font-size:11px;font-weight:700;min-width:26px;text-align:center;padding:4px 9px;border-radius:20px;font-family:var(--mono)}
  .badge{font-size:11px;font-weight:650;padding:3px 9px;border-radius:6px;display:inline-block}
  .b-teal{background:var(--teal-bg);color:var(--teal-ink)} .b-amber{background:var(--amber-bg);color:var(--amber)}
  .b-coral{background:var(--coral-bg);color:var(--coral)} .b-purple{background:var(--purple-bg);color:var(--purple)}
  .b-green{background:var(--green-bg);color:var(--green)} .b-red{background:var(--red-bg);color:var(--red)}
  .b-gray{background:var(--surface-2);color:var(--ink-2)}
  .ghost{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:560;color:var(--ink);transition:.13s}
  .ghost:hover{background:var(--surface-2);border-color:var(--ink-3)}
  .ghost.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .ghost.primary:hover{background:var(--pine);border-color:var(--pine)}
  .link{color:var(--teal-2);font-weight:600;cursor:pointer;background:none;border:none;font-size:inherit;padding:0}
  .link:hover{color:var(--pine);text-decoration:underline}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-weight:650;color:var(--ink-3);padding:9px 10px;border-bottom:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
  td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  td.r,th.r{text-align:right}
  tr:last-child td{border-bottom:none}
  .warnbox{background:var(--amber-bg);border:1px solid #EAD8AE;border-radius:var(--r-sm);padding:12px 15px;font-size:12.5px;color:var(--amber);display:flex;gap:9px;align-items:flex-start;line-height:1.55}
  .okbox{background:var(--teal-bg);border:1px solid #BCE3DD;border-radius:var(--r-sm);padding:12px 15px;font-size:12.5px;color:var(--teal-ink);display:flex;gap:9px;align-items:flex-start;line-height:1.55}
  .errbox{background:var(--red-bg);border:1px solid #EDC9C9;border-radius:var(--r-sm);padding:12px 15px;font-size:12.5px;color:var(--red);display:flex;gap:9px;align-items:flex-start;line-height:1.55}
  .footer{margin-top:38px;text-align:center;font-size:11.5px;color:var(--ink-3)}
  .drop{border:1.5px dashed var(--line-2);border-radius:18px;background:var(--surface);padding:40px 26px;text-align:center;transition:.18s;box-shadow:var(--shadow-sm)}
  .drop.hot{border-color:var(--teal);background:var(--teal-bg);transform:scale(1.006)}
  .drop h2{font-family:var(--display);font-size:21px;font-weight:700;margin:14px 0 6px;letter-spacing:.04em;text-transform:uppercase}
  .drop p{margin:0 auto;color:var(--ink-2);font-size:13px;max-width:480px;line-height:1.6}
  .drop .ic{width:50px;height:50px;border-radius:50%;background:linear-gradient(145deg,var(--pine),var(--teal));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 16px rgba(13,134,120,.3)}
  .filebtn{margin-top:18px;display:inline-block;background:var(--ink);color:#fff;border:none;padding:11px 22px;border-radius:9px;font-weight:600;font-size:13px;transition:.15s;box-shadow:var(--shadow-sm)}
  .filebtn:hover{background:var(--pine)}
  input.f,select.f,textarea.f{font:inherit;font-size:13px;padding:7px 9px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);box-sizing:border-box}
  input.f:focus,select.f:focus,textarea.f:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-bg)}
  label.fl{font-family:var(--display);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:3px}
  /* simple bar chart pieces */
  .bar-h{display:flex;align-items:center;gap:10px;margin-bottom:7px}
  .bar-h .bl{width:190px;flex-shrink:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;color:var(--ink-2)}
  .bar-h .btrack{flex:1;height:16px;border-radius:4px;background:var(--surface-2);overflow:hidden;position:relative}
  .bar-h .bfill{height:100%;border-radius:0 4px 4px 0;background:var(--teal);min-width:2px}
  .bar-h .bv{width:96px;flex-shrink:0;font-size:12px;font-family:var(--mono)}
  .cf-cols{display:flex;gap:14px;padding:6px 4px 0}
  .cf-col{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:132px}
  .cf-bar{width:26px;border-radius:4px 4px 0 0;min-height:2px}
  .cf-lab{text-align:center;font-size:10.5px;color:var(--ink-3);margin-top:5px;font-family:var(--mono)}
  .legend{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--ink-2);margin-top:10px}
  .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  @media print{
    body{background:#fff}
    .no-print{display:none !important}
    .wrap{max-width:none;padding:0;animation:none}
    .card,.metric{box-shadow:none}
    @page{margin:14mm}
  }
</style>
</head>

    out.byCat[cat] = out.byCat[cat] || { amt:0, hst:0, n:0, kind:t.kind };
    out.byCat[cat].amt = round2(out.byCat[cat].amt + amt);
    out.byCat[cat].hst = round2(out.byCat[cat].hst + (t.hst || 0));
    out.byCat[cat].n++;

function payrollByMonth(ledger) {

    if (!k) return;

    m[k].net = round2(m[k].net + ((e.totals && e.totals.net) || 0));

    if (x.active === false || x.kind === 'income') return;
    const step = x.frequency === 'weekly' ? 7 : x.frequency === 'biweekly' ? 14 : 0;
    if (step) {

      out.push({ ...x, due:'every ' + step + ' days' });

    } else {

  const avg = round2(last3.reduce((s,e) => s + ((e.totals && e.totals.net) || 0), 0) / last3.length);

    const d = new Date(lastTo + 'T12:00:00');

}

    return Array.from(s).sort().reverse();
  }, [txns, ledger]);
  const [period, setPeriod] = useState(monthsAvail[0] || ym(todayIso()));
  useEffect(() => { if (monthsAvail.length && !monthsAvail.includes(period) && period !== 'ytd') setPeriod(monthsAvail[0]); }, [monthsAvail]);
  const pbm = useMemo(() => payrollByMonth(ledger), [ledger]);
  const year = period === 'ytd' ? todayIso().slice(0,4) : period.slice(0,4);
  const opts = period === 'ytd' ? { year } : { month:period };

  const perLoc = useMemo(() => {
    const m = {};
    LOCATIONS.forEach(l => { m[l] = rollup(txns, { ...opts, location:l, skipCat:skip }); });
    m.__all = rollup(txns, { ...opts, skipCat:skip });

    rows.sort((a,b) => b.tot - a.tot);
    return rows;
  };
  const incRows = catRows('income');

    out.push(line(['Total income', ...LOCATIONS.map(l => n2(perLoc[l].income)), n2(all.income)]));
    out.push(line(['— Expenses —']));

    out.push('');

    out.push('');
    out.push(line(['PAYROLL (from payroll dashboard ledger)']));
    out.push(line(['Pay run', 'Period from', 'Period to', 'Cohort', 'People', 'Gross (pre-tax)', 'HST', 'Net paid']));

    const accName = id => { const a = p.accounts.find(x => x.id === id); return a ? a.name : ''; };
    txns.filter(t => period === 'ytd' ? (t.date||'').slice(0,4) === year : ym(t.date) === period)
      .slice().sort((a,b) => (a.date||'').localeCompare(b.date||''))
      .forEach(t => out.push(line([t.date, t.description, t.kind, catLabel(t.category), t.location, accName(t.account_id), t.source,
        (t.kind === 'income' ? '' : '-') + n2(t.amount), n2(t.hst), t.notes || ''])));
    const csv = '\ufeff' + out.join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
    a.download = 'Revibe_Books_' + (period === 'ytd' ? year + '_YTD' : period) + '.csv';

  return h('div', null,

        children:[h('option', { key:'ytd', value:'ytd' }, todayIso().slice(0,4) + ' — year to date')]

      h(Metric, { lab:'Net profit / (loss)', val:money(netProfit), mcls:netProfit >= 0 ? 'm-green' : 'm-coral', cls:netProfit >= 0 ? 'v-green' : 'v-red' }),
      h(Metric, { lab:'Net HST owing', val:money(hstNet), mcls:'m-amber', cls:'v-amber',
        hint:money(all.hstCollected) + ' collected − ' + money(round2(all.hstITC + payAmt.hst)) + ' ITCs' + (hstRemitted ? ' · ' + money(hstRemitted) + ' remitted' : '') })),

/* ===================== Budget & projection ===================== */
function BudgetTab(p) {
  const { txns, buds, ledger, settings } = p;
  const nowMonth = ym(todayIso());
  const pbm = useMemo(() => payrollByMonth(ledger), [ledger]);
  // avg monthly actual per category over the last 3 full months
  const last3 = useMemo(() => {
    const keys = [];
    const d = new Date(); d.setDate(15);
    for (let i = 1; i <= 3; i++) { const dd = new Date(d.getFullYear(), d.getMonth() - i, 15); keys.push(dd.toISOString().slice(0,7)); }
    return keys;
  }, []);
  const avgByCat = useMemo(() => {
    const m = {};
    last3.forEach(k => {
      const r = rollup(txns, { month:k, skipCat:settings.payrollSource === 'ledger' ? { payroll:1 } : null });
      Object.keys(r.byCat).forEach(c => { if (r.byCat[c].kind !== 'expense') return; m[c] = (m[c] || 0) + r.byCat[c].amt; });
      if (settings.payrollSource === 'ledger') m.payroll = (m.payroll || 0) + ((pbm[k] && pbm[k].net) || 0);
    });
    Object.keys(m).forEach(c => m[c] = round2(m[c] / 3));
    return m;
  }, [txns, last3, pbm, settings.payrollSource]);
  const cur = useMemo(() => rollup(txns, { month:nowMonth, skipCat:settings.payrollSource === 'ledger' ? { payroll:1 } : null }), [txns, nowMonth, settings.payrollSource]);
  const curByCat = c => c === 'payroll' && settings.payrollSource === 'ledger'
    ? ((pbm[nowMonth] && pbm[nowMonth].net) || 0)
    : ((cur.byCat[c] && cur.byCat[c].amt) || 0);
  const budFor = c => { const b = buds.find(x => x.category === c); return b ? b.monthly : null; };
  const setBud = (c, v) => {
    const num = v === '' ? null : parseFloat(v);
    p.onSetBudget(c, isNaN(num) ? null : num);
  };
  const expCats = CATS.filter(c => c.kind === 'expense' && !NON_PL[c.id]);
  const rows = expCats.map(c => ({ id:c.id, label:c.label, budget:budFor(c.id), actual:round2(curByCat(c.id)), avg:avgByCat[c.id] || 0 }))
    .filter(r => r.budget != null || r.actual || r.avg)
    .sort((a,b) => (b.budget || b.avg || b.actual) - (a.budget || a.avg || a.actual));
  const allCatsUnused = expCats.filter(c => !rows.some(r => r.id === c.id));
  const [addCat, setAddCat] = useState('');
  const totB = round2(rows.reduce((s,r) => s + (r.budget || 0), 0));
  const totA = round2(rows.reduce((s,r) => s + r.actual, 0));
  const totAvg = round2(rows.reduce((s,r) => s + r.avg, 0));
  // projection: income avg last 3 − budget (or avg) expenses
  const incAvg = useMemo(() => round2(last3.reduce((s,k) => s + rollup(txns, { month:k }).income, 0) / 3), [txns, last3]);
  const projExp = rows.reduce((s,r) => s + (r.budget != null ? r.budget : r.avg), 0);
  const proj = round2(incAvg - projExp);
  return h('div', null,
    h('div', { className:'metrics' },
      h(Metric, { lab:'Budgeted monthly spend', val:money0(totB), hint:'across ' + rows.filter(r => r.budget != null).length + ' budgeted categories' }),
      h(Metric, { lab:ymLabel(nowMonth) + ' actual so far', val:money0(totA), mcls:totB && totA > totB ? 'm-coral' : 'm-green', cls:totB && totA > totB ? 'v-red' : 'v-green' }),
      h(Metric, { lab:'Typical month (3-mo avg)', val:money0(totAvg), hint:'average spend, ' + last3.slice().reverse().map(ymLabel).join(' · ') }),
      h(Metric, { lab:'Projected monthly net', val:money0(proj), mcls:proj >= 0 ? 'm-green' : 'm-coral', cls:proj >= 0 ? 'v-green' : 'v-red',
        hint:'avg income ' + money0(incAvg) + ' − budget/avg expenses' })),
    h('div', { className:'card' },
      h('div', { className:'eyebrow', style:{ marginBottom:10 } }, 'Monthly budget vs actual — ' + ymLabel(nowMonth)),
      h('table', null,
        h('thead', null, h('tr', null, h('th', null, 'Category'), h('th', { className:'r' }, 'Budget / mo'),
          h('th', { className:'r' }, 'Actual'), h('th', { className:'r' }, '3-mo avg'), h('th', null, ''), h('th', { className:'r' }, 'Left'))),
        h('tbody', null, rows.map(r => {
          const base = r.budget != null ? r.budget : r.avg;
          const pct = base > 0 ? Math.min(1.4, r.actual / base) : 0;
          const over = base > 0 && r.actual > base;
          return h('tr', { key:r.id },
            h('td', null, r.label),
            h('td', { className:'r' }, h('input', { className:'f tnum', style:{ width:92, textAlign:'right', fontSize:12, padding:'4px 7px' },
              value:r.budget == null ? '' : r.budget, placeholder:r.avg ? String(Math.round(r.avg)) : '0',
              onChange:e => setBud(r.id, e.target.value) })),
            h('td', { className:'r tnum', style:{ fontWeight:600, color:over ? 'var(--red)' : 'var(--ink)' } }, money(r.actual)),
            h('td', { className:'r tnum dim' }, r.avg ? money(r.avg) : '—'),
            h('td', { style:{ minWidth:120 } }, base > 0 ? h('div', { className:'btrack', style:{ height:10, borderRadius:5, background:'var(--surface-2)', overflow:'hidden' } },
              h('div', { style:{ height:'100%', width:Math.round(pct / 1.4 * 100) + '%', background:over ? 'var(--coral)' : 'var(--teal)', borderRadius:5 } })) : null),
            h('td', { className:'r tnum', style:{ color:over ? 'var(--red)' : 'var(--green)' } }, base > 0 ? money(round2(base - r.actual)) : '—'));
        }))),
      allCatsUnused.length ? h('div', { style:{ marginTop:12, display:'flex', gap:8, alignItems:'center' } },
        h('select', { className:'f', value:addCat, onChange:e => setAddCat(e.target.value), style:{ maxWidth:280 } },
          [h('option', { key:'', value:'' }, '+ budget another category…')].concat(allCatsUnused.map(c => h('option', { key:c.id, value:c.id }, c.label)))),
        addCat ? h('button', { className:'ghost primary', style:{ padding:'6px 12px', fontSize:12 }, onClick:() => { setBud(addCat, 0); setAddCat(''); } }, 'Add') : null) : null),
    h('div', { className:'dim', style:{ fontSize:11.5, marginTop:10, lineHeight:1.6 } },
      'Set a monthly figure per category to budget against; blank means “just track the average.” Projection = average income over the last three months minus your budget (or the 3-month average where no budget is set). As more months of data land in the books, this sharpens automatically.'));
}

      rows.forEach(t => map[t.id] = t);

      lsSet(LS.tx, next);
      return next;
    });
    cloudWrite('bk_transactions', rows.map(t => txToRow(t, user)));
  };

    setTxns(prev => { const next = prev.filter(t => t.id !== id); lsSet(LS.tx, next); return next; });
    if (token) supaDelete(token, 'bk_transactions', id).catch(err => setMsg('Cloud delete failed: ' + err.message));
  };

    setAccounts(prev => {
      const next = prev.some(x => x.id === a.id) ? prev.map(x => x.id === a.id ? a : x) : prev.concat(a);
      lsSet(LS.acc, next); return next;
    });

  };

    setRecs(prev => {
      const next = prev.some(r => r.id === x.id) ? prev.map(r => r.id === x.id ? x : r) : prev.concat(x);
      lsSet(LS.rec, next); return next;
    });
    cloudWrite('bk_recurring', [recToRow(x, user)]);

  const deleteRecurring = id => {
    setRecs(prev => { const next = prev.filter(r => r.id !== id); lsSet(LS.rec, next); return next; });

  };
